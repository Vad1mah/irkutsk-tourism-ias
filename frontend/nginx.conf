server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: Yandex Maps JS API требует доступа к api-maps.yandex.ru (скрипты + тайлы),
    # *.yandex.ru / *.yandex.net (геокодер, поиск, статистика) и XHR/fetch к ним.
    # 'unsafe-eval' нужен для динамической компиляции внутри Yandex Maps loader.
    # CSP: Yandex Maps JS API подтягивает скрипты с api-maps.yandex.ru и yastatic.net
    # (CDN для maps-front-jsapi), геокодер с geocode-maps.yandex.ru, тайлы с *.maps.yandex.net.
    # 'unsafe-eval' нужен для динамической компиляции внутри Yandex Maps loader.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api-maps.yandex.ru https://yastatic.net https://*.yandex.ru https://yandex.ru https://*.yandex.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://yastatic.net https://*.yandex.ru https://*.yandex.net; font-src 'self' data: https://fonts.gstatic.com https://yastatic.net https://*.yandex.net; img-src 'self' data: blob: https: https://*.yandex.ru https://*.yandex.net https://yastatic.net; connect-src 'self' https://api-maps.yandex.ru https://yastatic.net https://*.yandex.ru https://*.yandex.net; worker-src 'self' blob:; frame-src 'self' https://*.yandex.ru" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/query/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
